<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <title>Avatar Beira do Campo</title>
  <rect width="800" height="800" fill="#081f14"/>

  <!-- O quadrado da marca fica inteiro dentro do recorte circular do X. -->
  <rect x="120" y="120" width="560" height="560" fill="#cdf463"/>

  <!-- Marca "quina do campo", preservada do sistema visual do portal. -->
  <g transform="translate(120 120) scale(11.6666667)" fill="none">
    <line x1="15" y1="33" x2="48" y2="33" stroke="#17251c" stroke-width="2.5"/>
    <line x1="15" y1="33" x2="15" y2="48" stroke="#17251c" stroke-width="2.5"/>
    <path d="M23 33 A8 8 0 0 1 15 41" stroke="#17251c" stroke-width="2.5"/>
    <line x1="15" y1="33" x2="15" y2="10" stroke="#17251c" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M15 10 L31 14.5 L15 19 Z" fill="#17251c"/>
    <circle cx="33.5" cy="41.5" r="2.6" fill="#17251c"/>
  </g>
</svg>
