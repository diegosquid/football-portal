# Sem `command`/`publish` de propósito: o build da Netlify é auto-detectado
# (runtime Next.js v5) e configurado no painel. Declarar aqui sobrescreveria
# aquilo sem necessidade.

[build]
  # Rede de segurança contra builds desnecessários.
  #
  # Os JSONs de dados (jogos, classificação, probabilidades) são servidos do R2
  # em runtime — ver src/lib/content-data.ts e scripts/publish-data.js. Eles
  # continuam versionados no repositório como fallback e histórico, mas um
  # commit que só mexe neles não muda nada no site publicado: rebuildar seria
  # queimar minuto de build à toa (eram ~56 builds/mês, contra 300 min do plano).
  #
  # O comando decide pelo código de saída: 0 = pular build, 1 = buildar.
  # `git diff --quiet` sai 0 quando NÃO há diferença fora dos arquivos de dados,
  # que é exatamente o caso "só dado mudou" → pula. Verificado contra commits
  # reais: um `data(jogos):` do histórico sai 0, um `content(news):` sai 1.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)content/jogos.json' ':(exclude)content/jogos-historico.json' ':(exclude)content/classificacao.json' ':(exclude)content/probabilidades.json' ':(exclude)content/probabilidades-historico.json'"
