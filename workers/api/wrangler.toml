name = "beiradocampo-api"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Notificação diária dos palpites — 11:05 UTC = 08:05 BRT.
# Roda depois da routine que atualiza jogos.json e probabilidades.json (07h BRT).
[triggers]
crons = ["5 11 * * *"]

[vars]
SITE_URL = "https://beiradocampo.com.br"
VAPID_SUBJECT = "mailto:contato@beiradocampo.com.br"

# Chave pública VAPID — não é segredo (vai pro navegador também).
# Preencher com a saída de: node scripts/generate-vapid-keys.js
VAPID_PUBLIC_KEY = "BMDACyLZJmm2lfceuNmEERAfCvcia7yPoiykaL5378-2BSHh-JwYCfsgVDSuYKLGQuGDnGWVKTX_kMXWT_lYRhQ"

# A chave PRIVADA é secret, nunca vai neste arquivo:
#   wrangler secret put VAPID_PRIVATE_KEY

[[d1_databases]]
binding = "DB"
database_name = "beiradocampo"
database_id = "5c71f70f-9b12-467b-abb5-bc4fb3e100c3"

[observability]
enabled = true
