<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Horizontal scroll demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #0f1115;
      color: #e6e6e6;
      padding: 40px 0;
    }

    h1 {
      margin: 0 24px 16px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .row {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 16px 24px;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: #444 transparent;
    }

    .row::-webkit-scrollbar { height: 8px; }
    .row::-webkit-scrollbar-track { background: transparent; }
    .row::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
    .row::-webkit-scrollbar-thumb:hover { background: #666; }

    .box {
      flex: 0 0 220px;
      height: 140px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      scroll-snap-align: start;
    }

    .box:nth-child(1) { background: linear-gradient(135deg, #ff6b6b, #ee5a6f); }
    .box:nth-child(2) { background: linear-gradient(135deg, #4ecdc4, #44a08d); }
    .box:nth-child(3) { background: linear-gradient(135deg, #f7b731, #f5cd79); }
    .box:nth-child(4) { background: linear-gradient(135deg, #5f27cd, #341f97); }
    .box:nth-child(5) { background: linear-gradient(135deg, #00d2d3, #54a0ff); }
    .box:nth-child(6) { background: linear-gradient(135deg, #ff9ff3, #f368e0); }
    .box:nth-child(7) { background: linear-gradient(135deg, #48dbfb, #0abde3); }
    .box:nth-child(8) { background: linear-gradient(135deg, #1dd1a1, #10ac84); }
  </style>
</head>
<body>
  <h1>Horizontal scroll — pure CSS</h1>

  <div class="row">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
    <div class="box">7</div>
    <div class="box">8</div>
  </div>
</body>
</html>
